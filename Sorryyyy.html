<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Love</title>

<style>
    *{
        margin:0;
        padding:0;
        overflow:hidden;
    }

    body{
        background:#000;
    }

    canvas{
        display:block;
    }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

const mouse={
    x:10000,
    y:10000
};

canvas.addEventListener("mousemove",(e)=>{
    mouse.x=e.clientX-canvas.width/2;
    mouse.y=-(e.clientY-canvas.height/2);
});

class Particle{

    constructor(){
        this.reset();
        this.history=[];
        for(let i=0;i<5;i++)
            this.history.push({x:this.x,y:this.y});
    }

    reset(){
        this.x=Math.random()*800-400;
        this.y=Math.random()*600-300;
        this.vx=Math.random()*4-2;
        this.vy=Math.random()*4-2;
        this.angle=Math.random()*Math.PI*2;
    }

    update(time){

        this.history.push({x:this.x,y:this.y});
        this.history.shift();

        const scale=15+3*Math.sin(time*0.03);

        const hx=16*Math.pow(Math.sin(this.angle),3)*scale;

        const hy=(
            13*Math.cos(this.angle)
            -5*Math.cos(2*this.angle)
            -2*Math.cos(3*this.angle)
            -Math.cos(4*this.angle)
        )*scale;

        const dx=hx-this.x;
        const dy=hy-this.y;

        this.vx+=dx*0.002;
        this.vy+=dy*0.002;

        this.vx+=-dy*0.001;
        this.vy+=dx*0.001;

        const mdx=this.x-mouse.x;
        const mdy=this.y-mouse.y;

        const dist=Math.sqrt(mdx*mdx+mdy*mdy);

        if(dist<150){
            this.vx+=(mdx/(dist+1))*3;
            this.vy+=(mdy/(dist+1))*3;
        }

        this.vx*=0.94;
        this.vy*=0.94;

        this.x+=this.vx;
        this.y+=this.vy;
    }

    draw(time){

        for(let i=0;i<this.history.length-1;i++){

            const intensity=0.2+(i/this.history.length)*0.8;

            const hue=320+40*Math.sin(time*0.02);

            ctx.strokeStyle=`hsla(${hue},100%,${50+intensity*20}%,${intensity})`;

            ctx.beginPath();

            ctx.moveTo(
                this.history[i].x+canvas.width/2,
                canvas.height/2-this.history[i].y
            );

            ctx.lineTo(
                this.history[i+1].x+canvas.width/2,
                canvas.height/2-this.history[i+1].y
            );

            ctx.stroke();
        }
    }
}

const particles=[];

for(let i=0;i<250;i++)
    particles.push(new Particle());

let time=0;

function animate(){

    ctx.fillStyle="rgba(0,0,0,0.15)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.lineWidth=2;

    particles.forEach(p=>{
        p.update(time);
        p.draw(time);
    });

    time++;

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
